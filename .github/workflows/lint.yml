name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          args: --timeout=600s
      - name: Run GoHawk
        run: |
          archive="$RUNNER_TEMP/gohawk.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            https://github.com/kojah/gohawk/releases/download/v0.3.4/gohawk_0.3.4_linux_amd64.tar.gz
          echo "31de88e72d54e1613bc6387179dc0c11376a40832bb45ddf281a8de22b59b1e4  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" --strip-components=1 gohawk_0.3.4_linux_amd64/gohawk
          "$RUNNER_TEMP/gohawk" -json -enable-all -disable=exitpolicy,goroutineownership,lockorder,processownership ./...

  # gofmt and the header scan are both seconds of work, so they share a
  # runner rather than each paying for a checkout and a Go install.
  hygiene:
    name: gofmt & license headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          make format
          if ! git diff --quiet; then
            echo "::error::go fmt produced changes; run 'make format' and commit"
            git --no-pager diff --stat
            exit 1
          fi
      - name: Check GPL-3.0 headers
        if: '!cancelled()'
        run: |
          missing=0
          while IFS= read -r f; do
            case "$f" in
              ./cmd/rune/docs/*|*_gomock.go|*.pb.go) continue ;;
            esac
            if ! head -3 "$f" | grep -q 'Copyright (C) .* The Rune Authors'; then
              echo "missing license header: $f"
              missing=1
            fi
          done < <(find . -name '*.go' -not -path './.git/*')
          exit $missing
