extensions:
  rune-agent:
    path: '$RUNE_DATADIR/bin/rune-agent'
    config:
      # Provider API keys, custom OpenAI-compatible endpoints, codex login
      # state, and local model registries now live host-side under the
      # top-level `models.*` block in the rune config (managed via the
      # `models providers` and `models local` rune shell commands).
      # Name of the project instructions file to discover. The agent
      # walks up from the workspace root looking for files with this
      # name and injects their contents into the system prompt.
      agents_file: AGENTS.md
      # Commit attribution text. {{provider}} and {{model}} expand to the
      # resolved model. Set commit to an empty string to disable attribution.
      attribution:
        commit: 'Co-Authored-By: Rune Agent ({{provider}}/{{model}}) <agent@rune.build>'
      # The chat (`agent`), query (`?`), compaction, and memory
      # consolidation models are host-side aliases named `default`,
      # `query`, `compact`, and `dream`. An unset alias falls back to
      # `default`, which itself resolves to the latest authenticated
      # provider's flagship model. Point any of them at a specific model
      # with the `models alias` rune shell command.
      skills:
        - .rune/skills
        - ~/.rune/skills
        - .agents/skills
        - ~/.agents/skills
      # Adds a web_search tool that asks a search API instead of driving
      # headless Chrome. Off until you name a provider, since it sends the
      # agent's queries to that service. keenable needs no account; set
      # KEENABLE_API_KEY in the environment for higher rate limits.
      #web_search:
      #  provider: keenable
      background_attr:
        bg: default
      user_msg_attr:
        fg: default
        bg: default
        flags: dim
      user_msg_background_attr:
        bg: gray
      # Marks each of your messages in the chat, left of its first line
      # (nf-fa-arrow_right). Must be a single character; set it to an
      # empty string to hide it.
      user_msg_icon: ""
      assistant_msg_attr:
        fg: default
        bg: default
        flags: italic
      # Columns left beside the chat transcript, split evenly on either
      # side. A negative value sets the transcript's width instead: -80
      # keeps it 80 columns wide and centered, filling a narrower tab.
      # 0 fills the tab.
      transcript_horizontal_padding: -80
      input_box_attr:
        fg: default
        bg: default
      input_box_placeholder_attr:
        fg: red
        bg: default
      input_box_frame_attr:
        fg: default
        bg: default
      # Characters of the composer's border. A graphics table names an
      # image the GUI draws over each slot's character, as frame charsets
      # do in rune.star; mode is "replace" (the default) to hide the
      # character under each image, or "overlay" to keep it showing
      # through the image's transparent pixels in input_box_frame_attr:
      #
      #   graphics:
      #     mode: replace
      #     topleft: file:///path/to/topleft.png
      #     topright: file:///path/to/topright.png
      #     bottomleft: file:///path/to/bottomleft.png
      #     bottomright: file:///path/to/bottomright.png
      #     horizontaltop: file:///path/to/top.png
      #     horizontalbottom: file:///path/to/bottom.png
      #     verticalleft: file:///path/to/left.png
      #     verticalright: file:///path/to/right.png
      input_box_frame_charset:
        topleft: "┌"
        topright: "┐"
        bottomleft: "└"
        bottomright: "┘"
        horizontaltop: "─"
        horizontalbottom: "─"
        verticalleft: "│"
        verticalright: "│"
      # Styling for the '#' context completion overlay. Defaults mirror
      # the command prompt (see "command.*_attr" in rune.star) so both
      # search overlays look consistent.
      completion_matched_text_attr:
        fg: blue
        bg: default
        flags: bold
      completion_focus_element_attr:
        fg: purple
        bg: default
      completion_element_attr:
        fg: default
        bg: default
        flags: dim
      # Sweep color of the radar-frame shader drawn over the compose box
      # while completion candidates stream in. Neutral by default so it
      # reads the same under every theme.
      completion_radar_color: dimgray
      # Accepted '#' completions remain readable in the sentence while
      # their attachment chips stay visible above the composer.
      inline_attachment_attr:
        fg: aqua
        bg: default
        flags: underline
      # When the modal (vi-style) composer opens, enter insert mode so
      # the first keystroke types instead of requiring `i`. Set to false
      # to keep the composer in normal mode at startup. Only affects the
      # modal composer; modeless is unchanged.
      editor_modal_start_insert: true
      # How many lines of surrounding code `chatreviewchanges` shows
      # around each hunk. Patches carry very little context of their
      # own, so the review reads the rest from the file as it stands
      # now. Set to 0 to show only the lines the agent changed.
      review_context_lines: 3
      # How many lines of your last message stay pinned over the top of
      # the chat once it scrolls out of sight. Longer messages are cut
      # short with an ellipsis; clicking the pin scrolls back to the
      # message. Set to 0 to disable the pin.
      pinned_user_msg_max_lines: 2
      # status_bar configures the chat's bottom status row.
      status_bar:
        # Whether the chat reserves its bottom row for the status bar.
        enabled: true
        # Layout of the status bar. Available components include:
        # Spinner, Status, Conversation, Elapsed, Model, Provider,
        # Effort, MaxTokens, TokensSent, TokensReceived, ContextTokens,
        # ContextWindow, ContextPct, Cache, CachePct, ContextGauge,
        # CacheGauge, Image, and ShiftRight. Pipe operators support bg,
        # fg, bold, italic, underline, reverse, and dim. Spinner and
        # Status take their colors from status below, so naming one here
        # only sets the fallback for a status the palette does not cover.
        #
        # Image draws a picture centered on the cell where it sits in the
        # bar (an even side lands half a cell left or up), extending over
        # the conversation above when it is taller than the bar, and cut
        # off outside the chat unless it overflows. It requires src, a
        # file:// or http(s):// URI, and takes:
        #   width           cells, or a percentage of the bar such as
        #                   "100%" (2)
        #   height          rows (1)
        #   reserve         cells it takes up in the bar (the width in
        #                   cells, or 0 for a percentage)
        #   x_offset        cells to move it right, negative for left, or
        #                   a percentage of the bar such as "50%" (0)
        #   y_offset        rows to move it down, negative for up (0)
        #   x_pixel_offset  device pixels to move it further right,
        #                   negative for left, to align it to the pixel (0)
        #   y_pixel_offset  device pixels to move it further down,
        #                   negative for up (0)
        #   fit             "contain" keeps the aspect ratio, "fill"
        #                   stretches
        #   z_index         stacking, as in kitty (0): 0 or more over the
        #                   text, negative under it, under -1073741824
        #                   also under the backgrounds; the higher one is
        #                   on top where images overlap, the later one in
        #                   the layout on ties
        #   overflow        extends it over the windows, frames and bars
        #                   around the chat; floating windows still cover it
        #   max_cut         cells a bar too narrow for it may push it out
        #                   of the bar before it is hidden (1)
        #   alt             drawn over the text when the image can't be
        #                   shown ("" for nothing); pixel offsets don't
        #                   move it
        #   ttl             how long a download is reused ("24h")
        # Sizes, cell offsets and max_cut are at most 4096 and pixel offsets
        # at most 65536, offsets in either direction; alt takes no control
        # characters but newlines.
        # A badge after the model, nudged 3 pixels up:
        #   {{ .Model | fg "white" }}  {{ .Image | src "file:///path/to/logo.png" | y_pixel_offset -3 }}
        layout: ' {{ .Spinner }} {{ .Status | bold }} █▓▒░  {{ .Model | fg "white" }}  {{ .Effort }}{{ .ShiftRight }}󰗂 {{ .Cache }}  {{ .Elapsed }}  {{ .Conversation | bold | fg "white" }}  {{ .ContextGauge }} '
        # Effect drawn over the whole bar while a turn runs. One of
        # blaze, burn, inferno, pulse, shine. Off by
        # default: every frame of the effect redraws the whole chat.
        #shader: pulse
        # Base attributes of the bar, matching the editor's status bar.
        # bg fills the whole row; fg is the foreground inherited by any
        # layout component that does not name one of its own.
        background_attr:
          bg: gray
          fg: silver
        # How the Spinner and Status elements dress per turn status. The
        # keys are the text the Status element draws, so a status missing
        # from this map keeps whatever colors its layout component
        # declares. `attr` colors both elements. `animation.ch` is the
        # spinner frames cycled while the turn reports that status, one
        # character per frame, and falls back to the built-in animation
        # when empty. `animation.attr` overrides `attr` for the spinner
        # alone, so the icon can carry a color of its own without
        # breaking the block it shares with the status text.
        status:
          IDLE:
            attr:
              fg: "white"
              bg: "silver"
              flags: bold
            animation:
              ch: ""
              attr:
                fg: "yellow"
          SENDING:
            attr:
              fg: "black"
              bg: "teal"
              flags: bold
            animation:
              ch: "⡘⡌⠆⢃⢡⠰"
              attr:
                fg: "default"
          REASONING:
            attr:
              fg: "white"
              bg: "navy"
              flags: bold
            animation:
              ch: "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"
              attr:
                fg: "default"
          RECEIVING:
            attr:
              fg: "black"
              bg: "magenta"
              flags: bold
            animation:
              ch: "⢡⢃⠆⡌⡘⠰"
              attr:
                fg: "default"
          EXECUTING:
            attr:
              fg: "default"
              bg: "red"
              flags: bold
            animation:
              ch: "⢀⢀⣀⢄⢂⢀⣀⣠⣤⣦⣧⣶⣦⣧⣦⣤⣴⣼⣴⣶⣧⣦⣤⣴⣼⣴⣶⣧⣦⣤⣴⣼⣴⣶⣧⣦⣤⣄⣀⣀⡠⡠⠔⠊⠁⠁  "
              attr:
                fg: "default"
          COMPACTING:
            attr:
              fg: "default"
              bg: "gray"
              flags: bold
            animation:
              ch: "⣉⠶⠶⠒⠒⠒⠶⠶⣉"
              attr:
                fg: "default"
          ASKING:
            attr:
              fg: "black"
              bg: "yellow"
              flags: bold
            animation:
              ch: "⠁⠂⠄⡀⢀⠠⠐⠈"
              attr:
                fg: "default"
          ERROR:
            attr:
              fg: "default"
              bg: "maroon"
              flags: bold
            animation:
              ch: ""
              attr:
                fg: "red"
        # The unfilled side of a gauge. It is darker than the bar so the
        # track's start and end are unmistakable; its fg doubles as the
        # label color over the unfilled part.
        gauge_empty_attr:
          fg: silver
          bg: gray
        # Brackets around a gauge, one cell each out of gauge_width.
        # They sit on the bar rather than on the track, so leaving their
        # bg out inherits background_attr's. Blank by default: the ramp
        # already marks where the track starts and ends.
        gauge_start_rune: ""
        gauge_end_rune: ""
        gauge_cap_attr:
          fg: green
        # A gauge's fill ramps through these stops across the track, so
        # how far along it the boundary sits is itself a reading. Cells
        # between two stops blend them, which is what keeps every cell
        # of a wide gauge a slightly different color. A full context
        # window is bad news and a full cache is good news, so the cache
        # gauge lists the same stops backwards.
        context_gauge_fill_attrs:
          - fg: black
            bg: green
          - fg: black
            bg: yellow
          - fg: black
            bg: red
        cache_gauge_fill_attrs:
          - fg: black
            bg: red
          - fg: black
            bg: yellow
          - fg: black
            bg: green
        # Cell width of the context and cache gauges.
        gauge_width: 18
