# Rune user configuration (emacs editor preset).

# ---------------------------------------------------------------------------
# GUI theme
#
# Rune ships a catalog of themes:
#   furman, romero, carmack, reynolds, brevik, thompson, pike, hopper,
#   kernighan, wozniak, auge, ritchie, kelleher, sanfilippo, greig, mullen
# Run `:guitheme` to preview live.
# ---------------------------------------------------------------------------
gui:
  default_theme: romero
#   font_size: 13
#   window_opacity: {fg: 1, bg: 1}
#   window_blur_radius: 100
#   # Remap physical keys before they reach the editor (see the key-mapping
#   # docs). Both sides use the command key-binding syntax. <capslock>,
#   # <numlock>, <scrolllock> and <menu> only act when remapped here.
#   key_mapping:
#     "<capslock>": "<esc>"

# ---------------------------------------------------------------------------
# Editor
#
# `aux_bar` is the strip left of each editor pane and `status_bar` the bar at
# the bottom of each pane. `emacs.message_bar` is the echo area; its `attr`
# sets the base attributes and `layout` wins over them. The transient mode
# label (ISEARCH, QUERY, ...) is styled by `editor.status_bar.layout` instead.
# ---------------------------------------------------------------------------
editor:
  mode: emacs
  auto_pair: true
  standard:
    attr: {fg: default, bg: default}
    search_attr: {fg: grey, bg: yellow}
  # The :fexplorer tree is an editable buffer: renaming a line renames
  # the file. It starts read-only here; <shift-esc> unlocks it for the
  # rest of the visit.
  file_explorer:
    read_only: true
#   tabspaces: 4
#   ruler: 90
#   autoindent: true            # syntax-driven indentation
#   auto_save: false            # flush dirty buffers ~2s after last edit
#   initial_folds: true         # collapse language-defined folds on open
#   aux_bar:
#     enabled:          true
#     lines:            absolute   # disabled | absolute | relative
#     git:              inline     # bar | inline | all | disabled
#     folds:            true
#     icons:            true
#     highlight_cursor: true
#   status_bar:
#     enabled: true
#     # Components: Status, Filepath, GitShortRef, GitDiffAdd, GitDiffDel,
#     # ShiftRight, CursorColumn, CursorLine, TotalLines, Language.
#     # Pipe operators: bg, fg, bold, italic, underline, reverse, dim.
#     layout: ' {{ .Status | bg "red" | fg "white" | bold }} █▓▒░  {{ .Filepath | fg "white" }}  {{ .GitShortRef | fg "white" }}   {{ .GitDiffAdd | fg "green" }}   {{ .GitDiffDel | fg "red" }} {{ .ShiftRight }} {{ .CursorColumn | fg "white" }}:{{ .CursorLine | fg "white" }}  {{ .TotalLines | fg "white" }} lines  ░▒▓█ {{ .Language | bold | fg "white" | bg "red" }} '
#     background_attr:       {bg: gray}
#     foreground_error_attr: {fg: yellow}
#   emacs:
#     message_bar:
#       attr: {fg: default, bg: gray}
#       layout: '░▒▓█ {{ .Message | fg "white" }} '

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
terminal:
  modal: false
  # C-s is isearch-forward's key everywhere else in this preset (see
  # command.key_bindings and the editor's own incremental search), so
  # scrollback search reuses it instead of the default <ctrl-shift-f>.
  search:
    find_key: "<ctrl-s>"
#   max_lines:         1000
#   initial_reservoir: 0           # set to non-zero to speed up terminal initialization
#   plugin:
#     # Layout of the bar shown above a `!` command. Components:
#     # Command, StatusIcon, ExitStatus, Elapsed, AlignRight, AlignCenter.
#     # Pipe operators: bg, fg, bold, italic, underline, reverse, dim.
#     bar_layout: ' {{ .StatusIcon | bg "gray" | fg "white" }} █▓▒░{{ .AlignCenter }}{{ .Command | fg "white" | bold }}{{ .AlignRight }}  ░▒▓█ {{ .Elapsed | fg "white" | bg "gray" }} '
#     bar_background_attr: {bg: default}
#     bar_align_bottom:    true
#     status_success_icon: ""
#     status_success_attr: {fg: green}
#     status_error_icon:   ""
#     status_error_attr:   {fg: red}
#     animation: "⠃⠅⠆⠘⠨⠰⠉⠒⠤⠑⠡⠢⠊⠌⠔⠇⠸⠎⠱⠣⠜⠪⠕⠋⠙⠓⠚⠍⠩⠥⠬⠖⠲⠦⠴⠏⠹⠧⠼⠫⠝⠮⠵⠺⠗⠞⠳⠛⠭⠶⠟⠻⠷⠾⠯⠽⠿"

# ---------------------------------------------------------------------------
# Command prompt
#
# `key` opens the command prompt; `history_key` toggles between the command
# list and history. Aliases layer on top of built-ins: a string value is the
# substitution, a dict with `command` + `completer` adds completion. Set a
# key_binding value to "" to unbind a built-in.
# ---------------------------------------------------------------------------
command:
  key: <alt-x>                       # execute-extended-command (M-x)
#   history_key: <alt-shift-x>
#   max_history: 20000
#   aliases:
#     # Simple alias: `:w` runs `:write`.
#     w: write
#     # Alias with a completer: typing `:e <tab>` suggests files.
#     e:    {command: edit, completer: files}
#     # Alias with a shell completer (here: git branch names).
#     gitcheckout:
#       command:   "!! git -C $WORKSPACE_PATH checkout $1"
#       completer: '! git -C $WORKSPACE_PATH branch --format="%(refname:short)"'
#     conf: config
  key_bindings:
    # Files and sessions use familiar Emacs C-x chords.
    # A focused terminal swallows C-x before Rune sees it, so everything here
    # also has an <alt-shift> chord below; C-x is the GNU-native second path.
    "<ctrl-x><ctrl-s>": write            # save-buffer
    "<ctrl-x>s": writeall             # save-some-buffers
    "<ctrl-x>u": "undo prefix"           # undo
    "<ctrl-x><ctrl-c>": quit             # exit when no buffers have pending changes
    "<ctrl-x><ctrl-f>": searchfile       # find-file
    "<ctrl-x>0": windowclose             # delete-window
    "<ctrl-x>1": windowcloseall          # delete-other-windows
    "<ctrl-x>2": "windownew down"        # split-window-below
    "<ctrl-x>3": "windownew right"       # split-window-right
    "<ctrl-x>o": "windowfocus other"     # other-window
    "<ctrl-x>^": "windowresize increase height"   # enlarge-window
    "<ctrl-x>{": "windowresize decrease width"    # shrink-window-horizontally
    "<ctrl-x>-": "windowresize decrease height"   # shrink-window-if-larger-than-buffer
    "<ctrl-x>}": "windowresize increase width"    # enlarge-window-horizontally
    "<ctrl-x>+": "windowresize reset"             # balance-windows
    "<alt-shift-x>": history             # M-X, the M-x history sibling
    # P/N/B/F follows Emacs's previous, next, backward, and forward directions.
    "<alt-shift-p>": "windowfocus up"
    "<alt-shift-b>": "windowfocus left"
    "<alt-shift-n>": "windowfocus down"
    "<alt-shift-f>": "windowfocus right"
    "<ctrl-shift-alt-p>": "windowmove up"
    "<ctrl-shift-alt-b>": "windowmove left"
    "<ctrl-shift-alt-n>": "windowmove down"
    "<ctrl-shift-alt-f>": "windowmove right"
    "<alt-shift-d>": "windownew down"
    "<alt-shift-r>": "windownew right"
    "<alt-shift-k>": windowclose
    "<ctrl-shift-alt-k>": windowcloseall
    "<alt-shift-m>": windowtogglemaximize
    "<alt-shift-i>": "lsp implementation"
    "<alt-shift-g>": "jumptolocation next search"
    "<ctrl-shift-alt-g>": "jumptolocation prev search"
    "<alt-shift-h>": "lsp hover"
    "<ctrl-shift-alt-h>": "echo {prompt}lsp<space>hover<space>"
    "<ctrl-shift-alt-i>": "echo {prompt}lsp<space>implementation<space>"
    # Control-Shift arrows resize, as windsize.el's defaults do, without
    # consuming Emacs editing letters; M-S-up / M-S-down duplicate the line.
    # Like the C-x chords, a focused terminal keeps them.
    "<ctrl-shift-up>": "windowresize increase height"
    "<ctrl-shift-left>": "windowresize decrease width"
    "<ctrl-shift-down>": "windowresize decrease height"
    "<ctrl-shift-right>": "windowresize increase width"
    # M-[ and M-] are free in GNU; their shifted M-{ / M-} are paragraph
    # motions, so reordering tabs moves up to <ctrl-shift-alt>.
    "<alt-]>": tabnext
    "<alt-[>": tabprevious
    "<ctrl-tab>": tabnext
    "<ctrl-shift-tab>": tabprevious
    "<alt-shift-w>": tabclose
    "<ctrl-shift-alt-]>": "tabmove right"
    "<ctrl-shift-alt-[>": "tabmove left"
    # M-, / C-M-, follows GNU xref history; C-x C-x exchanges point and mark.
    "<alt-,>": "cursorhistory prev"
    "<ctrl-alt-,>": "cursorhistory next"
    "<ctrl-x><ctrl-x>": exchangepointandmark
    # GNU xref, Dired, switch-buffer, symbol-jump, and completion semantics guide these keys.
    "<alt-.>": "lsp definition"
    "<alt-shift-/>": "lsp references"    # alt+shift+slash chord, i.e. M-?
    "<ctrl-alt-.>": "echo {prompt}lsp<space>definition<space>"
    "<ctrl-shift-alt-/>": "echo {prompt}lsp<space>references<space>"
    # Dired and the symbol jumps sit on <alt-shift> so they stay reachable
    # while a terminal owns the keyboard. GNU has no chord to inherit here:
    # M-g i (imenu) is the natural home, but the editor owns the M-g
    # goto-map. Variables take V because M-X is the history key.
    "<alt-shift-o>": fexplorer
    "<alt-shift-j>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.method|local.definition.function<space>"
    "<alt-shift-s>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.type<space>"
    "<alt-shift-v>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.var<space>"
    "<alt-s>o": searchtext           # two-key M-s o, not the M-? chord above
    "<ctrl-alt-\\\\>": "lsp format"
    "<ctrl-alt-i>": "lsp complete"
    # <alt-shift-l> steps diagnostics and <alt-shift-e> opens their picker.
    # The F-keys repeat those and visit Git changes, but a focused terminal
    # eats them. <f3>/<f4> stay unbound: the editor owns them as GNU's
    # kmacro keys.
    "<alt-shift-l>": lspnextdiagnostic
    "<ctrl-shift-alt-l>": lspprevdiagnostic
    "<alt-shift-e>": "lsp diagnostics"
    "<f5>": gitprevchange
    "<f6>": gitnextchange
    "<f7>": lspprevdiagnostic
    "<f8>": lspnextdiagnostic
    "<f9>": "lsp diagnostics"
    # Bookmarks stay on <alt-shift>+F-key so a focused terminal cannot eat
    # them: F2 sets and clears, F3 visits, F4 highlights. GNU's own C-x r m /
    # C-x r b / C-x r l are three-chord sequences. Visiting backwards and
    # deleting them all are left to the command prompt.
    "<alt-shift-f2>": "locationtoggle bookmark"
    "<alt-shift-f3>": "jumptolocation next bookmark"
    "<alt-shift-f4>": "locationhighlight bookmark"
    # Bindings shared with the other presets. <alt> and <ctrl> carry only what
    # GNU Emacs itself defines (M-x, M-., M-,, M-?, M-s o, C-M-., C-M-,, C-M-\,
    # C-M-i and the C-x chords); Super belongs to the desktop on Linux, so
    # everything Rune-only lives on <alt-shift>, which the editor leaves free
    # and a focused terminal hands back to Rune. <ctrl-shift-alt> means move
    # for layout, prompt for LSP, and reverse for anything that steps through
    # a list. M-digit and C-M-digit are numeric arguments, so workspaces take
    # <ctrl-shift-alt>, and moving a window to one is left to the command
    # prompt, as are the maximum and minimum window sizes. The clipboard
    # pairs GNU's M-w / C-y letters with <ctrl-alt>.
    "<ctrl-shift-alt-,>": "config"
    "<alt-/>": "cheatsheet"
    "<ctrl-alt-q>": "quit"
    "<alt-shift-=>": "guifontsize increase"
    "<alt-shift-->": "guifontsize decrease"
    "<alt-shift-t>": "tabnew"
    "<ctrl-alt-w>": "clipboardcopy"
    "<ctrl-alt-y>": "clipboardpaste"
    "<ctrl-shift-alt-backspace>": "windowresize reset"
    "<ctrl-shift-alt-s>": "windowdefaultsplit h"
    "<ctrl-shift-alt-v>": "windowdefaultsplit v"
    "<alt-enter>": "terminalneworsplit"
    "<alt-shift-enter>": "!"
    "<ctrl-alt-`>": "workspacesearch"
    "<ctrl-shift-alt-1>": "workspacefocus 1"
    "<ctrl-shift-alt-2>": "workspacefocus 2"
    "<ctrl-shift-alt-3>": "workspacefocus 3"
    "<ctrl-shift-alt-4>": "workspacefocus 4"
    "<ctrl-shift-alt-5>": "workspacefocus 5"
    "<ctrl-shift-alt-6>": "workspacefocus 6"
    "<ctrl-shift-alt-7>": "workspacefocus 7"
    "<ctrl-shift-alt-8>": "workspacefocus 8"
    "<ctrl-shift-alt-9>": "workspacefocus 9"

