# Rune user configuration (helix editor preset).

# ---------------------------------------------------------------------------
# GUI theme
#
# Rune ships a catalog of themes. Set `default_theme` to any of:
#   furman, romero, carmack, reynolds, brevik, thompson, pike, hopper,
#   kernighan, wozniak, auge, ritchie, kelleher, sanfilippo, greig, mullen
# Run `:guitheme` to preview live.
# ---------------------------------------------------------------------------
gui:
  default_theme: romero
#   font_size: 13
#   window_opacity: {fg: 1, bg: 1}
#   window_blur_radius: 100
#   # Remap physical keys before they reach the editor (see the key-mapping
#   # docs). Both sides use the command key-binding syntax. <capslock>,
#   # <numlock>, <scrolllock> and <menu> only act when remapped here.
#   key_mapping:
#     "<capslock>": "<esc>"

# ---------------------------------------------------------------------------
# Editor
#
# `aux_bar` is the strip left of each editor pane, `status_bar` the bar at the
# bottom of each pane, and `helix.message_bar` the line showing search prompts
# and echoed messages.
# ---------------------------------------------------------------------------
editor:
  mode: helix
  helix:
    attr: {fg: default, bg: default}
    search_attr: {fg: grey, bg: yellow}
#     message_bar:
#       attr: {fg: default, bg: gray}
#       layout: '░▒▓█ {{ .Message | fg "white" }} '
#   tabspaces: 4
#   ruler: 90
#   autoindent: true            # syntax-driven indentation
#   auto_pair: false            # auto-pair quotes/brackets/braces
#   auto_save: false            # flush dirty buffers ~2s after last edit
#   initial_folds: true         # collapse language-defined folds on open
#   aux_bar:
#     enabled:          true
#     lines:            absolute   # disabled | absolute | relative
#     git:              inline     # bar | inline | all | disabled
#     folds:            true
#     icons:            true
#     highlight_cursor: true
#   status_bar:
#     enabled: true
#     # Components: Status, Filepath, GitShortRef, GitDiffAdd, GitDiffDel,
#     # ShiftRight, CursorColumn, CursorLine, TotalLines, Language.
#     # Pipe operators: bg, fg, bold, italic, underline, reverse, dim.
#     layout: ' {{ .Status | bg "red" | fg "white" | bold }} █▓▒░  {{ .Filepath | fg "white" }}  {{ .GitShortRef | fg "white" }}   {{ .GitDiffAdd | fg "green" }}   {{ .GitDiffDel | fg "red" }} {{ .ShiftRight }} {{ .CursorColumn | fg "white" }}:{{ .CursorLine | fg "white" }}  {{ .TotalLines | fg "white" }} lines  ░▒▓█ {{ .Language | bold | fg "white" | bg "red" }} '
#     background_attr:       {bg: gray}
#     foreground_error_attr: {fg: yellow}

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
# terminal:
#   modal:             true        # enter modal terminal mode on <esc>
#   max_lines:         1000
#   initial_reservoir: 0           # set to non-zero to speed up terminal initialization
#   plugin:
#     # Layout of the bar shown above a `!` command. Components:
#     # Command, StatusIcon, ExitStatus, Elapsed, AlignRight, AlignCenter.
#     # Pipe operators: bg, fg, bold, italic, underline, reverse, dim.
#     bar_layout: ' {{ .StatusIcon | bg "gray" | fg "white" }} █▓▒░{{ .AlignCenter }}{{ .Command | fg "white" | bold }}{{ .AlignRight }}  ░▒▓█ {{ .Elapsed | fg "white" | bg "gray" }} '
#     bar_background_attr: {bg: default}
#     bar_align_bottom:    true
#     status_success_icon: ""
#     status_success_attr: {fg: green}
#     status_error_icon:   ""
#     status_error_attr:   {fg: red}
#     animation: "⠃⠅⠆⠘⠨⠰⠉⠒⠤⠑⠡⠢⠊⠌⠔⠇⠸⠎⠱⠣⠜⠪⠕⠋⠙⠓⠚⠍⠩⠥⠬⠖⠲⠦⠴⠏⠹⠧⠼⠫⠝⠮⠵⠺⠗⠞⠳⠛⠭⠶⠟⠻⠷⠾⠯⠽⠿"

# ---------------------------------------------------------------------------
# Command prompt
#
# `key` opens the command prompt; `history_key` toggles between the command
# list and history. Aliases layer on top of built-ins: a string value is the
# substitution, a dict with `command` + `completer` adds completion. Set a
# key_binding value to "" to unbind one added by an extension.
# ---------------------------------------------------------------------------
command:
#   key:         ":"
#   history_key: <ctrl-alt-r>
#   max_history: 20000
  # Helix's typable command names. Rune has no per-split quit, so :q and :wq
  # close the window, as <ctrl-w>q does, and the last window stays open:
  # leave with :qa.
  aliases:
    q: windowclose                        # quit
    wq: [write, windowclose]              # write-quit
    x: [write, windowclose]               # exit
    qa: quit                              # quit-all
    qa!: forcequit!                       # quit-all!
    wa: writeall                          # write-all
    o: {command: edit, completer: files}  # open
    bc: tabclose                          # buffer-close
    bca: tabcloseall                      # buffer-close-all
    bn: tabnext                           # buffer-next
    bp: tabprevious                       # buffer-previous
    vs: windownew right                   # vsplit
    hs: windownew down                    # hsplit
    sp: windownew down                    # hsplit
    fmt: lsp format                       # format
    rl: reloadfile!                       # reload
#     # Simple alias: `:w` runs `:write`.
#     w: write
#     # Alias with a completer: typing `:e <tab>` suggests files.
#     e:    {command: edit, completer: files}
#     # Alias with a shell completer (here: git branch names).
#     # The `! …` template runs a shell line whose stdout becomes one
#     # completion candidate per line.
#     gitcheckout:
#       command:   "!! git -C $WORKSPACE_PATH checkout $1"
#       completer: '! git -C $WORKSPACE_PATH branch --format="%(refname:short)"'
#     # Open this configuration file (already bound to <ctrl-alt-,>).
#     conf: config
  key_bindings:
    # Helix's <space> leader menu. The editor owns every key it binds, so a
    # sequence only reaches the command layer when the editor declines its
    # first key: <space> and <ctrl-w> are free in normal mode and taken in
    # insert mode, which is exactly the gate these need.
    "<space>f": searchfile                # file_picker
    "<space>e": fexplorer                 # file_explorer
    "<space>b": tabsearch                 # buffer_picker
    "<space>j": "cursorhistory jump"      # jumplist_picker
    "<space>/": searchtext                # global_search
    "<space>k": "lsp hover"               # hover
    "<space>r": "lsp rename"              # rename_symbol
    "<space>h": "lsp references"          # select references to symbol
    "<space>d": "lsp diagnostics"         # diagnostics_picker
    "<space>D": "lsp diagnostics"         # workspace_diagnostics_picker
    "<space>g": gitnextchange             # changed_file_picker
    "<space>y": clipboardcopy             # yank_to_clipboard
    "<space>p": clipboardpaste            # paste_clipboard_after
    "<space>?": history                   # command_palette
    "<space>s": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.method|local.definition.function<space>"
    "<space>t": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.type<space>"
    "<space>v": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.var<space>"
    # Helix's <ctrl-w> window menu. <space>w reaches the same commands in
    # Helix, but a Rune sequence is exactly two keys, so only the <ctrl-w>
    # spelling survives the translation. Helix also takes each key with
    # <ctrl> still held, and the arrows for h j k l.
    "<ctrl-w>h": "windowfocus left"
    "<ctrl-w>j": "windowfocus down"
    "<ctrl-w>k": "windowfocus up"
    "<ctrl-w>l": "windowfocus right"
    "<ctrl-w><ctrl-h>": "windowfocus left"
    "<ctrl-w><ctrl-j>": "windowfocus down"
    "<ctrl-w><ctrl-k>": "windowfocus up"
    "<ctrl-w><ctrl-l>": "windowfocus right"
    "<ctrl-w><left>": "windowfocus left"
    "<ctrl-w><down>": "windowfocus down"
    "<ctrl-w><up>": "windowfocus up"
    "<ctrl-w><right>": "windowfocus right"
    "<ctrl-w>H": "windowmove left"
    "<ctrl-w>J": "windowmove down"
    "<ctrl-w>K": "windowmove up"
    "<ctrl-w>L": "windowmove right"
    "<ctrl-w>w": "windowfocus other"      # rotate_view
    "<ctrl-w><ctrl-w>": "windowfocus other"
    "<ctrl-w>s": "windownew down"         # hsplit
    "<ctrl-w><ctrl-s>": "windownew down"
    "<ctrl-w>v": "windownew right"        # vsplit
    "<ctrl-w><ctrl-v>": "windownew right"
    "<ctrl-w>q": windowclose              # wclose
    "<ctrl-w><ctrl-q>": windowclose
    "<ctrl-w>o": windowcloseall           # wonly
    "<ctrl-w><ctrl-o>": windowcloseall
    "<ctrl-w>f": "echo {prompt}edit<space>"   # goto_file
    # Helix's jumplist spans files. The editor walks the file's own jumplist
    # first and declines these keys at either end of it, so the jump carries
    # on through Rune's cursor history into other files.
    "<ctrl-o>": "cursorhistory prev"      # jump_backward
    "<ctrl-i>": "cursorhistory next"      # jump_forward
    # Bindings shared with the other presets. Super belongs to the desktop on
    # Linux, so Rune-only commands live on <ctrl-alt> and on the <alt> chords
    # Helix leaves free. <alt> with h/j/k/l focuses a window. <ctrl-alt>
    # carries the app-wide commands and the rest of the layout: h/j/k/l
    # resize, brackets step through tabs, digits pick a workspace. <shift>
    # means move for layout, prompt for LSP, and reverse for anything that
    # steps through a list.
    "<shift-tab>": "fexplorer"
    "<ctrl-alt-r>": "history"
    "<ctrl-alt-,>": "config"
    "<ctrl-alt-/>": "cheatsheet"
    "<ctrl-alt-q>": "quit"
    "<ctrl-alt-=>": "guifontsize increase"
    "<ctrl-alt-->": "guifontsize decrease"
    # Helix leaves A-n unimplemented behind its tree-sitter sibling motions,
    # so it opens a tab as in the vim preset.
    "<alt-n>": "tabnew"
    "<ctrl-alt-n>": "windownew"
    "<alt-w>": "windowclose"
    "<alt-shift-w>": "windowcloseall"
    "<ctrl-alt-w>": "tabclose"
    "<ctrl-alt-]>": "tabnext"
    "<ctrl-alt-[>": "tabprevious"
    "<ctrl-shift-alt-]>": "tabmove right"
    "<ctrl-shift-alt-[>": "tabmove left"
    "<ctrl-alt-enter>": "echo {prompt}windowconverttab<space>"
    "<ctrl-tab>": "tabnext"
    "<ctrl-shift-tab>": "tabprevious"
    "<ctrl-alt-y>": "clipboardcopy"
    "<ctrl-alt-p>": "clipboardpaste"
    # GNOME and KDE cycle an application's windows on <alt-`>, which Helix
    # also uses to uppercase the selection.
    "<ctrl-alt-`>": "tabsearch"
    "<ctrl-shift-alt-`>": "workspacesearch"
    "<alt-h>": "windowfocus left"
    "<alt-l>": "windowfocus right"
    "<alt-j>": "windowfocus down"
    "<alt-k>": "windowfocus up"
    "<ctrl-shift-alt-h>": "windowmove left"
    "<ctrl-shift-alt-l>": "windowmove right"
    "<ctrl-shift-alt-j>": "windowmove down"
    "<ctrl-shift-alt-k>": "windowmove up"
    # KDE, Cinnamon, Xfce and MATE lock the screen on <ctrl-alt-l>; remap it
    # with gui.key_mapping on those desktops.
    "<ctrl-alt-h>": "windowresize decrease width"
    "<ctrl-alt-j>": "windowresize decrease height"
    "<ctrl-alt-k>": "windowresize increase height"
    "<ctrl-alt-l>": "windowresize increase width"
    "<ctrl-shift-alt-backspace>": "windowresize reset"
    "<ctrl-shift-alt-=>": ["windowresize max width", "windowresize max height"]
    "<ctrl-shift-alt-->": ["windowresize min width", "windowresize min height"]
    # s and v follow Helix's <ctrl-w>s / <ctrl-w>v.
    "<ctrl-alt-s>": "windowdefaultsplit h"
    "<ctrl-alt-v>": "windowdefaultsplit v"
    "<alt-m>": "windowtogglemaximize"
    "<alt-enter>": "terminalneworsplit"
    "<alt-shift-enter>": "!"
    # Definition and implementation stay on Helix's gd / gi: A-d and A-i are
    # Helix's delete and shrink-selection. Their prompts avoid A-I too.
    "<alt-f>": "lsp rename"
    "<alt-shift-d>": "echo {prompt}lsp<space>definition<space>"
    "<ctrl-shift-alt-i>": "echo {prompt}lsp<space>implementation<space>"
    "<ctrl-alt-e>": "lsp diagnostics"
    "<ctrl-alt-b>": "lsp format"
    "<ctrl-alt-.>": "lspnextdiagnostic"
    "<ctrl-alt-;>": "lspprevdiagnostic"
    "<ctrl-shift-alt-.>": "gitnextchange"
    "<ctrl-shift-alt-;>": "gitprevchange"
    "<ctrl-space>": "lsp complete"
    "<alt-1>": "tabfocus 1"
    "<alt-2>": "tabfocus 2"
    "<alt-3>": "tabfocus 3"
    "<alt-4>": "tabfocus 4"
    "<alt-5>": "tabfocus 5"
    "<alt-6>": "tabfocus 6"
    "<alt-7>": "tabfocus 7"
    "<alt-8>": "tabfocus 8"
    "<alt-9>": "tabfocus 9"
    "<ctrl-alt-1>": "workspacefocus 1"
    "<ctrl-alt-2>": "workspacefocus 2"
    "<ctrl-alt-3>": "workspacefocus 3"
    "<ctrl-alt-4>": "workspacefocus 4"
    "<ctrl-alt-5>": "workspacefocus 5"
    "<ctrl-alt-6>": "workspacefocus 6"
    "<ctrl-alt-7>": "workspacefocus 7"
    "<ctrl-alt-8>": "workspacefocus 8"
    "<ctrl-alt-9>": "workspacefocus 9"
    "<ctrl-shift-alt-1>": "workspacemove 1"
    "<ctrl-shift-alt-2>": "workspacemove 2"
    "<ctrl-shift-alt-3>": "workspacemove 3"
    "<ctrl-shift-alt-4>": "workspacemove 4"
    "<ctrl-shift-alt-5>": "workspacemove 5"
    "<ctrl-shift-alt-6>": "workspacemove 6"
    "<ctrl-shift-alt-7>": "workspacemove 7"
    "<ctrl-shift-alt-8>": "workspacemove 8"
    "<ctrl-shift-alt-9>": "workspacemove 9"

