# Rune user configuration (standard editor preset).

# ---------------------------------------------------------------------------
# GUI theme
#
# Rune ships a catalog of themes:
#   furman, romero, carmack, reynolds, brevik, thompson, pike, hopper,
#   kernighan, wozniak, auge, ritchie, kelleher, sanfilippo, greig, mullen
# Run `:guitheme` to preview live.
# ---------------------------------------------------------------------------
gui:
  default_theme: romero
#   font_size: 13
#   window_opacity: {fg: 1, bg: 1}
#   window_blur_radius: 100
#   # Remap physical keys before they reach the editor (see the key-mapping
#   # docs). Both sides use the command key-binding syntax. <capslock>,
#   # <numlock>, <scrolllock> and <menu> only act when remapped here.
#   key_mapping:
#     "<capslock>": "<esc>"

# ---------------------------------------------------------------------------
# Editor
#
# `aux_bar` is the strip left of each buffer, `status_bar` the bar at the
# bottom of each buffer, and `standard.search` the find and replace box.
# ---------------------------------------------------------------------------
editor:
  mode: standard
  auto_pair: true
  # The :fexplorer tree is an editable buffer: renaming a line renames
  # the file. It starts read-only here; <shift-esc> unlocks it for the
  # rest of the visit.
  file_explorer:
    read_only: true
#   tabspaces: 4
#   ruler: 90
#   autoindent: true            # syntax-driven indentation
#   auto_save: false            # flush dirty buffers ~2s after last edit
#   initial_folds: true         # collapse language-defined folds on open
#   aux_bar:
#     enabled:          true
#     lines:            absolute   # disabled | absolute | relative
#     git:              inline     # bar | inline | all | disabled
#     folds:            true
#     icons:            true
#     highlight_cursor: true
#   status_bar:
#     enabled: true
#     # Components: Status, Filepath, GitShortRef, GitDiffAdd, GitDiffDel,
#     # ShiftRight, CursorColumn, CursorLine, TotalLines, Language.
#     # Pipe operators: bg, fg, bold, italic, underline, reverse, dim.
#     layout: ' {{ .Status | bg "red" | fg "white" | bold }} █▓▒░  {{ .Filepath | fg "white" }}  {{ .GitShortRef | fg "white" }}   {{ .GitDiffAdd | fg "green" }}   {{ .GitDiffDel | fg "red" }} {{ .ShiftRight }} {{ .CursorColumn | fg "white" }}:{{ .CursorLine | fg "white" }}  {{ .TotalLines | fg "white" }} lines  ░▒▓█ {{ .Language | bold | fg "white" | bg "red" }} '
#     background_attr:       {bg: gray}
#     foreground_error_attr: {fg: yellow}
  standard:
#     attr:        {fg: default, bg: default}   # buffer text
#     search_attr: {fg: grey, bg: yellow}       # search matches
    search:
      # Find and replace follow the editor's own <ctrl> layer on Linux;
      # <meta> is left to Rune.
      find_key:    "<ctrl-f>"
      replace_key: "<ctrl-r>"
#       attr:               {fg: default, bg: default}
#       input_attr:         {fg: default, bg: default}
#       placeholder_attr:   {fg: gray, bg: default}
#       frame_attr:         {fg: gray, bg: default}
#       focus_frame_attr:   {fg: silver, bg: default}
#       button_attr:        {fg: default, bg: gray}
#       button_hover_attr:  {fg: default, bg: blue}
#       match_attr:         {fg: grey, bg: yellow}
#       current_match_attr: {fg: default, bg: default}
#       status_attr:        {fg: default, bg: default}

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
terminal:
  modal: false
  # <ctrl-f> belongs to the shell; scrollback search sits on Rune's layer.
  search:
    find_key: "<meta-f>"
#   max_lines:         1000
#   initial_reservoir: 0           # set to non-zero to speed up terminal initialization
#   plugin:
#     # Layout of the bar shown above a `!` command. Components:
#     # Command, StatusIcon, ExitStatus, Elapsed, AlignRight, AlignCenter.
#     # Pipe operators: bg, fg, bold, italic, underline, reverse, dim.
#     bar_layout: ' {{ .StatusIcon | bg "gray" | fg "white" }} █▓▒░{{ .AlignCenter }}{{ .Command | fg "white" | bold }}{{ .AlignRight }}  ░▒▓█ {{ .Elapsed | fg "white" | bg "gray" }} '
#     bar_background_attr: {bg: default}
#     bar_align_bottom:    true
#     status_success_icon: ""
#     status_success_attr: {fg: green}
#     status_error_icon:   ""
#     status_error_attr:   {fg: red}
#     animation: "⠃⠅⠆⠘⠨⠰⠉⠒⠤⠑⠡⠢⠊⠌⠔⠇⠸⠎⠱⠣⠜⠪⠕⠋⠙⠓⠚⠍⠩⠥⠬⠖⠲⠦⠴⠏⠹⠧⠼⠫⠝⠮⠵⠺⠗⠞⠳⠛⠭⠶⠟⠻⠷⠾⠯⠽⠿"

# ---------------------------------------------------------------------------
# Command prompt
#
# `key` opens the command prompt; `history_key` toggles between the command
# list and history. Aliases layer on top of built-ins: a string value is the
# substitution, a dict with `command` + `completer` adds completion. Set a
# key_binding value to "" to unbind a built-in.
# ---------------------------------------------------------------------------
command:
  key: "<meta-;>"
  history_key: "<shift-meta-;>"
#   max_history: 20000
#   aliases:
#     # Simple alias: `:w` runs `:write`.
#     w: write
#     # Alias with a completer: typing `:e <tab>` suggests files.
#     e:    {command: edit, completer: files}
#     # Alias with a shell completer (here: git branch names).
#     gitcheckout:
#       command:   "!! git -C $WORKSPACE_PATH checkout $1"
#       completer: '! git -C $WORKSPACE_PATH branch --format="%(refname:short)"'
#     conf: config
  key_bindings:
    # Rune's own commands live on one <meta> layer (Super on Linux), clear of
    # the editor and the terminal. <ctrl> belongs to the editor and the terminal.
    "<meta-s>": "write"
    "<shift-meta-s>": "writeall"
    "<meta-o>": "searchfile"
    "<shift-meta-o>": "fexplorer"
    "<shift-meta-;>": "history"
    "<meta-/>": "cheatsheet"
    "<ctrl-meta-q>": "quit"
    "<meta-=>": "guifontsize increase"
    "<meta-->": "guifontsize decrease"
    "<f2>": "jumptolocation next bookmark"
    "<shift-f2>": "jumptolocation previous bookmark"
    "<meta-f2>": "locationtoggle bookmark"
    "<shift-meta-f2>": "locationdeleteall bookmark"
    "<f3>": "jumptolocation next search"
    "<shift-f3>": "jumptolocation prev search"
    # IJKL points up, left, down, right. <meta> focuses a window, <shift>
    # moves it.
    "<meta-i>": "windowfocus up"
    "<meta-j>": "windowfocus left"
    "<meta-k>": "windowfocus down"
    "<meta-l>": "windowfocus right"
    "<shift-meta-i>": "windowmove up"
    "<shift-meta-j>": "windowmove left"
    "<shift-meta-k>": "windowmove down"
    "<shift-meta-l>": "windowmove right"
    "<meta-n>": "windownew"
    "<meta-q>": "windowclose"
    "<shift-meta-q>": "windowcloseall"
    "<meta-m>": "windowtogglemaximize"
    "<meta-h>": "windowdefaultsplit h"
    "<meta-v>": "windowdefaultsplit v"
    "<shift-meta-backspace>": "windowresize reset"
    "<shift-meta-+>": ["windowresize max width", "windowresize max height"]
    "<shift-meta-->": ["windowresize min width", "windowresize min height"]
    "<meta-enter>": "terminalneworsplit"
    "<shift-meta-enter>": "!"
    # Tabs: brackets step through them, <shift> reorders.
    "<shift-meta-n>": "tabnew"
    "<meta-w>": "tabclose"
    "<meta-[>": "tabprevious"
    "<meta-]>": "tabnext"
    "<shift-meta-[>": "tabmove left"
    "<shift-meta-]>": "tabmove right"
    "<ctrl-meta-enter>": "echo {prompt}windowconverttab<space>"
    "<shift-meta-`>": "tabsearch"
    # Workspaces: digits focus, <shift> moves.
    "<meta-`>": "workspacesearch"
    "<meta-1>": "workspacefocus 1"
    "<meta-2>": "workspacefocus 2"
    "<meta-3>": "workspacefocus 3"
    "<meta-4>": "workspacefocus 4"
    "<meta-5>": "workspacefocus 5"
    "<meta-6>": "workspacefocus 6"
    "<meta-7>": "workspacefocus 7"
    "<meta-8>": "workspacefocus 8"
    "<meta-9>": "workspacefocus 9"
    "<shift-meta-1>": "workspacemove 1"
    "<shift-meta-2>": "workspacemove 2"
    "<shift-meta-3>": "workspacemove 3"
    "<shift-meta-4>": "workspacemove 4"
    "<shift-meta-5>": "workspacemove 5"
    "<shift-meta-6>": "workspacemove 6"
    "<shift-meta-7>": "workspacemove 7"
    "<shift-meta-8>": "workspacemove 8"
    "<shift-meta-9>": "workspacemove 9"
    # Code: <meta> asks about the caret, <shift> prompts for a name. Period
    # and comma step forward and back through diagnostics, and with <shift>
    # through Git changes; U steps back and forward through cursor history.
    "<meta-t>": "lsp hover"
    "<shift-meta-t>": "echo {prompt}lsp<space>hover<space>"
    "<meta-r>": "lsp references"
    "<shift-meta-r>": "echo {prompt}lsp<space>references<space>"
    "<meta-d>": "lsp definition"
    "<shift-meta-d>": "echo {prompt}lsp<space>definition<space>"
    # Spelled as fuzzy_search spells its searchfile chord so this wins.
    "<m-p>": "lsp implementation"
    "<shift-meta-p>": "echo {prompt}lsp<space>implementation<space>"
    "<meta-c>": "lsp declaration"
    "<shift-meta-c>": "echo {prompt}lsp<space>declaration<space>"
    "<meta-y>": "lsp type-definition"
    "<shift-meta-y>": "echo {prompt}lsp<space>type-definition<space>"
    "<meta-g>": "lsp signature-help"
    "<meta-e>": "lsp diagnostics"
    "<meta-b>": "lsp format"
    "<ctrl-space>": "lsp complete"
    "<meta-.>": "lspnextdiagnostic"
    "<meta-,>": "lspprevdiagnostic"
    "<shift-meta-.>": "gitnextchange"
    "<shift-meta-,>": "gitprevchange"
    "<meta-u>": "cursorhistory prev"
    "<shift-meta-u>": "cursorhistory next"
    "<ctrl-meta-f>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.method|local.definition.function<space>"
    "<ctrl-meta-s>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.type<space>"
    "<ctrl-meta-x>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.var<space>"
    # The fuzzy_search package binds its symbol pickers on <alt-shift>;
    # free that layer for the editor and the terminal. Package installs
    # match keys by spelling, so these repeat the package's own spelling.
    "<a-s-f>": ""
    "<a-s-v>": ""
    "<a-s-s>": ""
    "<s-m-f>": ""

# ---------------------------------------------------------------------------
# Animations
#
# `active_content_tab` plays over tabs with work in progress, such as an agent
# turn, and `active_workspace_tab` over the workspace tabs that own them. Their
# shaders: blaze, burn, inferno, noise, pulse, shine, trippy.
# ---------------------------------------------------------------------------
# animations:
#   loading_workspace: true
#   open_workspace:
#     enabled:  true
#     # shader:   burn
#     # duration: 1s
#   active_content_tab:
#     enabled: true
#     shader:  inferno
#     fps:     10
#     loop:    1400ms
#   active_workspace_tab:
#     enabled: true
#     shader:  inferno
#     fps:     10
#     loop:    1400ms

# ---------------------------------------------------------------------------
# Notifications
# ---------------------------------------------------------------------------
# notifications:
#   auto_close:   5s
