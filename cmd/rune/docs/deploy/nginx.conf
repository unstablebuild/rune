server {
    listen ${PORT} default_server;
    server_name _;

    # Behind Cloud Run's front end, TLS terminates on 443 and traffic is
    # forwarded to this container on ${PORT} (8080). Without these, nginx's
    # automatic trailing-slash redirect emits an absolute Location that
    # includes the internal :8080, leaking it into the browser address bar.
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/docs-rune;
    index index.html;

    # Released Rune binaries link to the pre-rename path.
    location = /learn/modal-editor {
        return 301 /learn/vim-editor;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
