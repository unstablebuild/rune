# Rune user configuration (vim editor preset).

# ---------------------------------------------------------------------------
# GUI theme
#
# Rune ships a catalog of themes. Set `default_theme` to any of:
#   furman, romero, carmack, reynolds, brevik, thompson, pike, hopper,
#   kernighan, wozniak, auge, ritchie, kelleher, sanfilippo, greig, mullen
# Run `:guitheme` to preview live.
# ---------------------------------------------------------------------------
gui:
  default_theme: romero
#   font_size: 13
#   window_opacity: {fg: 1, bg: 1}
#   window_blur_radius: 100
#   # Remap physical keys before they reach the editor (see the key-mapping
#   # docs). Both sides use the command key-binding syntax. <capslock>,
#   # <numlock>, <scrolllock> and <menu> only act when remapped here.
#   key_mapping:
#     "<capslock>": "<esc>"

# ---------------------------------------------------------------------------
# Editor
#
# `aux_bar` is the strip left of each editor pane, `status_bar` the bar at the
# bottom of each pane, and `modal.message_bar` the line showing search prompts
# and echoed messages.
# ---------------------------------------------------------------------------
# editor:
#   tabspaces: 4
#   ruler: 90
#   autoindent: true            # syntax-driven indentation
#   auto_pair: false            # auto-pair quotes/brackets/braces (vim default)
#   auto_save: false            # flush dirty buffers ~2s after last edit
#   initial_folds: true         # collapse language-defined folds on open
#   aux_bar:
#     enabled:          true
#     lines:            absolute   # disabled | absolute | relative
#     git:              inline     # bar | inline | all | disabled
#     folds:            true
#     icons:            true
#     highlight_cursor: true
#   status_bar:
#     enabled: true
#     # Components: Status, Filepath, GitShortRef, GitDiffAdd, GitDiffDel,
#     # ShiftRight, CursorColumn, CursorLine, TotalLines, Language.
#     # Pipe operators: bg, fg, bold, italic, underline, reverse, dim.
#     layout: ' {{ .Status | bg "red" | fg "white" | bold }} █▓▒░  {{ .Filepath | fg "white" }}  {{ .GitShortRef | fg "white" }}   {{ .GitDiffAdd | fg "green" }}   {{ .GitDiffDel | fg "red" }} {{ .ShiftRight }} {{ .CursorColumn | fg "white" }}:{{ .CursorLine | fg "white" }}  {{ .TotalLines | fg "white" }} lines  ░▒▓█ {{ .Language | bold | fg "white" | bg "red" }} '
#     background_attr:       {bg: gray}
#     foreground_error_attr: {fg: yellow}
#   vim:
#     message_bar:
#       attr: {fg: default, bg: gray}
#       layout: '░▒▓█ {{ .Message | fg "white" }} '

# ---------------------------------------------------------------------------
# Terminal
# ---------------------------------------------------------------------------
# terminal:
#   modal:             true        # enter modal terminal mode on <esc>
#   max_lines:         1000
#   initial_reservoir: 0           # set to non-zero to speed up terminal initialization
#   plugin:
#     # Layout of the bar shown above a `!` command. Components:
#     # Command, StatusIcon, ExitStatus, Elapsed, AlignRight, AlignCenter.
#     # Pipe operators: bg, fg, bold, italic, underline, reverse, dim.
#     bar_layout: ' {{ .StatusIcon | bg "gray" | fg "white" }} █▓▒░{{ .AlignCenter }}{{ .Command | fg "white" | bold }}{{ .AlignRight }}  ░▒▓█ {{ .Elapsed | fg "white" | bg "gray" }} '
#     bar_background_attr: {bg: default}
#     bar_align_bottom:    true
#     status_success_icon: ""
#     status_success_attr: {fg: green}
#     status_error_icon:   ""
#     status_error_attr:   {fg: red}
#     animation: "⠃⠅⠆⠘⠨⠰⠉⠒⠤⠑⠡⠢⠊⠌⠔⠇⠸⠎⠱⠣⠜⠪⠕⠋⠙⠓⠚⠍⠩⠥⠬⠖⠲⠦⠴⠏⠹⠧⠼⠫⠝⠮⠵⠺⠗⠞⠳⠛⠭⠶⠟⠻⠷⠾⠯⠽⠿"

# ---------------------------------------------------------------------------
# Command prompt
#
# `key` opens the command prompt; `history_key` toggles between the command
# list and history. Aliases layer on top of built-ins: a string value is the
# substitution, a dict with `command` + `completer` adds completion. Set a
# key_binding value to "" to unbind one added by an extension.
# ---------------------------------------------------------------------------
command:
#   key:         ":"
#   history_key: <ctrl-alt-r>
#   max_history: 20000
#   aliases:
#     # Simple alias: `:w` runs `:write`.
#     w: write
#     # Alias with a completer: typing `:e <tab>` suggests files.
#     e:    {command: edit, completer: files}
#     # Alias with a shell completer (here: git branch names).
#     # The `! …` template runs a shell line whose stdout becomes one
#     # completion candidate per line.
#     gitcheckout:
#       command:   "!! git -C $WORKSPACE_PATH checkout $1"
#       completer: '! git -C $WORKSPACE_PATH branch --format="%(refname:short)"'
#     # Open this configuration file (already bound to <ctrl-alt-,>).
#     conf: config
  key_bindings:
    # Super belongs to the desktop on Linux, so Rune's own chords live on
    # <ctrl-alt> and <alt>, which a focused terminal hands back to Rune.
    # <alt> with h/j/k/l focuses a window. <ctrl-alt> carries the app-wide
    # commands and the rest of the layout: h/j/k/l resize, brackets step
    # through tabs, digits pick a workspace. <shift> means move for layout,
    # prompt for LSP, and reverse for anything that steps through a list.
    "<shift-tab>": "fexplorer"
    "<ctrl-alt-r>": "history"
    "<ctrl-alt-,>": "config"
    "<ctrl-alt-/>": "cheatsheet"
    "<ctrl-alt-q>": "quit"
    "<ctrl-alt-=>": "guifontsize increase"
    "<ctrl-alt-->": "guifontsize decrease"
    "<alt-n>": "tabnew"
    "<ctrl-alt-enter>": "echo {prompt}windowconverttab<space>"
    "<ctrl-alt-w>": "tabclose"
    "<ctrl-alt-]>": "tabnext"
    "<ctrl-alt-[>": "tabprevious"
    "<ctrl-alt-n>": "windownew"
    # Yank and put on the <ctrl-alt> layer, since <ctrl-c>/<ctrl-v> belong
    # to the terminal.
    "<ctrl-alt-y>": "clipboardcopy"
    "<ctrl-alt-p>": "clipboardpaste"
    # GNOME and KDE cycle an application's windows on <alt-`>.
    "<ctrl-alt-`>": "tabsearch"
    "<ctrl-shift-alt-`>": "workspacesearch"
    "<ctrl-shift-alt-]>": "tabmove right"
    "<ctrl-shift-alt-[>": "tabmove left"
    "<alt-h>": "windowfocus left"
    "<alt-l>": "windowfocus right"
    "<alt-j>": "windowfocus down"
    "<alt-k>": "windowfocus up"
    "<ctrl-shift-alt-h>": "windowmove left"
    "<ctrl-shift-alt-l>": "windowmove right"
    "<ctrl-shift-alt-j>": "windowmove down"
    "<ctrl-shift-alt-k>": "windowmove up"
    # KDE, Cinnamon, Xfce and MATE lock the screen on <ctrl-alt-l>; remap it
    # with gui.key_mapping on those desktops.
    "<ctrl-alt-h>": "windowresize decrease width"
    "<ctrl-alt-j>": "windowresize decrease height"
    "<ctrl-alt-k>": "windowresize increase height"
    "<ctrl-alt-l>": "windowresize increase width"
    "<ctrl-shift-alt-backspace>": "windowresize reset"
    "<ctrl-shift-alt-=>": ["windowresize max width", "windowresize max height"]
    "<ctrl-shift-alt-->": ["windowresize min width", "windowresize min height"]
    "<alt-w>": "windowclose"
    "<alt-shift-w>": "windowcloseall"
    # s and v follow vim's <ctrl-w>s / <ctrl-w>v; the fuzzy-search
    # extension takes <alt-shift-v> for its workspace-wide variable search.
    "<ctrl-alt-s>": "windowdefaultsplit h"
    "<ctrl-alt-v>": "windowdefaultsplit v"
    "<alt-m>": "windowtogglemaximize"
    "<alt-f>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.method|local.definition.function<space>"
    "<alt-v>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.var<space>"
    "<alt-s>": "echo {prompt}jumptoast<space>locals.scm<space>local.definition.type<space>"
    "<alt-e>": "lspnextdiagnostic"
    "<alt-shift-e>": "lspprevdiagnostic"
    "<alt-t>": "lsp hover"
    "<alt-shift-t>": "echo {prompt}lsp<space>hover<space>"
    "<ctrl-alt-e>": "lsp diagnostics"
    "<f2>": "lsp rename"
    "<alt-r>": "lsp references"
    "<alt-shift-r>": "echo {prompt}lsp<space>references<space>"
    "<alt-d>": "lsp definition"
    "<alt-shift-d>": "echo {prompt}lsp<space>definition<space>"
    "<alt-i>": "lsp implementation"
    "<alt-shift-i>": "echo {prompt}lsp<space>implementation<space>"
    "<ctrl-o>": "cursorhistory prev"
    "<ctrl-i>": "cursorhistory next"
    "<alt-b>": "lsp format"
    "<ctrl-space>": "lsp complete"
    "<alt-g>": "gitnextchange"
    "<alt-shift-g>": "gitprevchange"
    "<alt-enter>": "terminalneworsplit"
    "<alt-shift-enter>": "!"
    "<alt-1>": "tabfocus 1"
    "<alt-2>": "tabfocus 2"
    "<alt-3>": "tabfocus 3"
    "<alt-4>": "tabfocus 4"
    "<alt-5>": "tabfocus 5"
    "<alt-6>": "tabfocus 6"
    "<alt-7>": "tabfocus 7"
    "<alt-8>": "tabfocus 8"
    "<alt-9>": "tabfocus 9"
    "<alt-shift-1>": "tabmove 1"
    "<alt-shift-2>": "tabmove 2"
    "<alt-shift-3>": "tabmove 3"
    "<alt-shift-4>": "tabmove 4"
    "<alt-shift-5>": "tabmove 5"
    "<alt-shift-6>": "tabmove 6"
    "<alt-shift-7>": "tabmove 7"
    "<alt-shift-8>": "tabmove 8"
    "<alt-shift-9>": "tabmove 9"
    "<ctrl-alt-1>": "workspacefocus 1"
    "<ctrl-alt-2>": "workspacefocus 2"
    "<ctrl-alt-3>": "workspacefocus 3"
    "<ctrl-alt-4>": "workspacefocus 4"
    "<ctrl-alt-5>": "workspacefocus 5"
    "<ctrl-alt-6>": "workspacefocus 6"
    "<ctrl-alt-7>": "workspacefocus 7"
    "<ctrl-alt-8>": "workspacefocus 8"
    "<ctrl-alt-9>": "workspacefocus 9"
    "<ctrl-shift-alt-1>": "workspacemove 1"
    "<ctrl-shift-alt-2>": "workspacemove 2"
    "<ctrl-shift-alt-3>": "workspacemove 3"
    "<ctrl-shift-alt-4>": "workspacemove 4"
    "<ctrl-shift-alt-5>": "workspacemove 5"
    "<ctrl-shift-alt-6>": "workspacemove 6"
    "<ctrl-shift-alt-7>": "workspacemove 7"
    "<ctrl-shift-alt-8>": "workspacemove 8"
    "<ctrl-shift-alt-9>": "workspacemove 9"

