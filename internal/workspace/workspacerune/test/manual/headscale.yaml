# Headscale configuration for the manual rune:// setup.
#
# The embedded DERP region is advertised but is not needed when both
# Rune instances are on the same host or LAN: they connect directly. It
# is enabled, with `derp.urls` empty, so nothing reaches out to
# Tailscale's public DERP map and the setup stays self-contained.
#
# For instances on different networks, replace server_url with a
# publicly reachable HTTPS address and put a TLS-terminating proxy in
# front, otherwise DERP relaying cannot be used as a fallback.
server_url: http://127.0.0.1:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 0.0.0.0:9090
grpc_listen_addr: 0.0.0.0:50443
grpc_allow_insecure: false
noise:
  private_key_path: /var/lib/headscale/noise_private.key
prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential
derp:
  server:
    enabled: true
    region_id: 999
    region_code: headscale
    region_name: Headscale Embedded DERP
    stun_listen_addr: 0.0.0.0:3478
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 24h
disable_check_updates: true
node:
  ephemeral:
    inactivity_timeout: 30m
database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite
log:
  format: text
  level: info
dns:
  magic_dns: true
  override_local_dns: false
  base_domain: rune.test
  nameservers:
    global:
      - 1.1.1.1
policy:
  mode: database
