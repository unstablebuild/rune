default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
    -   id: check-yaml
        exclude: .drone.yml
    -   id: end-of-file-fixer
        # Golden files and language fixtures are byte-exact test inputs;
        # appending a trailing newline silently changes what they assert.
        exclude: (^|/)testdata(_[a-z_]+)?/|\.asc$

-   repo: https://github.com/golangci/golangci-lint
    rev: v2.5.0
    hooks:
    -   id: golangci-lint-full

-   repo: https://github.com/kojah/gohawk
    rev: v0.3.5
    hooks:
    -   id: gohawk
        args: [-json, -enable-all, '-disable=exitpolicy,goroutineownership,lockorder,processownership', ./...]

-   repo: local
    hooks:
    -   id: validate_generate
        language: system
        files: (\.pb.go$|\.proto$)
        name: validate_generate
        # if make generate changes any files, then pre-commit
        # automatically fails
        entry: make generate

-   repo: local
    hooks:
    -   id: validate_license
        language: system
        files: \.go
        name: validate_license
        entry: make license

-   repo: local
    hooks:
    -   id: validate_format
        language: system
        files: \.go$
        name: validate_format
        # if make format changes any files, then pre-commit
        # automatically fails
        entry: make format
        pass_filenames: false

-   repo: local
    hooks:
    -   id: make_test
        language: system
        name: make_test
        # Run the full test suite before allowing a commit.
        entry: make test
        pass_filenames: false
        types: [go]

-   repo: local
    hooks:
    -   id: dco_signoff
        language: system
        name: dco_signoff
        entry: scripts/dco-signoff.sh
        stages: [commit-msg]
