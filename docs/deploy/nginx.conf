server {
    listen ${PORT} default_server;
    server_name _;

    # Behind Cloud Run's front end, TLS terminates on 443 and traffic is
    # forwarded to this container on ${PORT} (8080). Without these, nginx's
    # automatic trailing-slash redirect emits an absolute Location that
    # includes the internal :8080, leaking it into the browser address bar.
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/docs-rune;
    index index.html;

    # Released Rune binaries link to the pre-rename path.
    location = /learn/modal-editor {
        return 301 /learn/vim-editor;
    }

    # Terminal guides moved under Learn > Terminal; external sites still link here.
    location ~ ^/learn/(tasks|faster-terminal-startup)/?$ {
        return 301 /learn/terminal/$1;
    }

    # Asset filenames are content-hashed, so they never change. A missing one
    # must 404 rather than fall back to HTML: a page built by an earlier
    # deploy would otherwise parse index.html as JS ("Unexpected token '<'")
    # and never hydrate.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Without an explicit policy, browsers cache HTML heuristically from
    # Last-Modified and keep referencing asset hashes a newer deploy removed.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
